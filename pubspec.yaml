name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7+1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  equatable: ^2.0.7
  get: ^4.7.2
  envied: ^1.1.1
  flutter_svg: ^2.1.0
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  skeletonizer: ^2.0.1
  table_calendar: ^3.1.3
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  retrofit: ^4.4.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  drift: ^2.14.0
  sqlite3_flutter_libs: any
  # Notification dependencies
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^18.0.0
  permission_handler: ^11.3.1
  # Timezone for scheduled notifications
  timezone: ^0.9.2
  # Face Recognition & WebSocket dependencies
  web_socket_channel: ^3.0.3
  camera: ^0.11.0+2
  image: ^4.2.0
  convert: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  envied_generator: ^1.1.1
  import_sorter: ^4.6.0
  retrofit_generator: ^9.2.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Black.ttf
        - asset: assets/fonts/Inter_18pt-BlackItalic.ttf
        - asset: assets/fonts/Inter_18pt-Bold.ttf
        - asset: assets/fonts/Inter_18pt-BoldItalic.ttf
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
        - asset: assets/fonts/Inter_18pt-ExtraBoldItalic.ttf
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
        - asset: assets/fonts/Inter_18pt-ExtraLightItalic.ttf
        - asset: assets/fonts/Inter_18pt-Italic.ttf
        - asset: assets/fonts/Inter_18pt-Light.ttf
        - asset: assets/fonts/Inter_18pt-LightItalic.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
        - asset: assets/fonts/Inter_18pt-MediumItalic.ttf
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
        - asset: assets/fonts/Inter_18pt-SemiBoldItalic.ttf
        - asset: assets/fonts/Inter_18pt-Thin.ttf
        - asset: assets/fonts/Inter_18pt-ThinItalic.ttf
  assets:
    - assets/images/
    - assets/translations/en-US.json
    - assets/translations/id-ID.json
    - assets/images/illustrations/
    - assets/icons/

import_sorter:
  emojis: true
  comments: false